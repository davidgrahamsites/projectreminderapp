name: ProjectReminder
options:
  bundleIdPrefix: com.danielwang.projectreminder
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ReminderKit:
    path: Packages/ReminderKit
  DesignKit:
    path: Packages/DesignKit

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

# NOTE: No App Groups / CloudKit anywhere — a FREE Apple personal team cannot use those
# capabilities, and including them makes Xcode signing fail. Each app keeps its own local
# SwiftData store; cross-device sync is handled entirely by LAN + WatchConnectivity.
# Three bundle ids only (iOS, iOS.watchkitapp, mac) to stay light on the 10-App-IDs/7-days limit.

targets:
  # macOS — the authoring surface (where projects are set)
  ProjectReminderMac:
    type: application
    platform: macOS
    sources:
      - path: ProjectReminderMac
    dependencies:
      - package: ReminderKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: ProjectReminderMac/Info.plist
      properties:
        CFBundleDisplayName: Project Reminder
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: ProjectReminderMac/Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true

  # iOS — the bridge + on-the-go editor
  ProjectReminder:
    type: application
    platform: iOS
    sources:
      - path: ProjectReminder
    dependencies:
      - package: ReminderKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ProjectReminder/Info.plist
      properties:
        CFBundleDisplayName: Reminders
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Project Reminder syncs your projects with your Mac over the local network."
        NSBonjourServices:
          - _projreminder._tcp

  # watchOS — the main surface. Bundle id MUST be <iOS id>.watchkitapp and the companion id
  # MUST equal the iOS app's id, or the watch app won't install/pair.
  ProjectReminderWatch:
    type: application
    platform: watchOS
    sources:
      - path: ProjectReminderWatch
    dependencies:
      - package: ReminderKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: ProjectReminderWatch/Info.plist
      properties:
        CFBundleDisplayName: Reminders
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.danielwang.projectreminder

schemes:
  ProjectReminderMac:
    build:
      targets: { ProjectReminderMac: all }
    run: { config: Debug }
  ProjectReminder:
    build:
      targets: { ProjectReminder: all }
    run: { config: Debug }
  ProjectReminderWatch:
    build:
      targets: { ProjectReminderWatch: all }
    run: { config: Debug }
