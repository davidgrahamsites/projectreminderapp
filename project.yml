name: ProjectReminder
options:
  bundleIdPrefix: com.danielwang.projectreminder
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ReminderKit:
    path: Packages/ReminderKit
  DesignKit:
    path: Packages/DesignKit

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  # macOS — the authoring surface (where projects are set)
  ProjectReminderMac:
    type: application
    platform: macOS
    sources:
      - path: ProjectReminderMac
    dependencies:
      - package: ReminderKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: ProjectReminderMac/Info.plist
      properties:
        CFBundleDisplayName: Project Reminder
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: ProjectReminderMac/Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.danielwang.projectreminder

  # iOS — the bridge + on-the-go editor
  ProjectReminder:
    type: application
    platform: iOS
    sources:
      - path: ProjectReminder
    dependencies:
      - package: ReminderKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ProjectReminder/Info.plist
      properties:
        CFBundleDisplayName: Reminders
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Project Reminder syncs your projects with your Mac over the local network."
        NSBonjourServices:
          - _projreminder._tcp
    entitlements:
      path: ProjectReminder/iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danielwang.projectreminder

  # watchOS — the main surface
  ProjectReminderWatch:
    type: application
    platform: watchOS
    sources:
      - path: ProjectReminderWatch
    dependencies:
      - package: ReminderKit
      - package: DesignKit
      - target: ProjectReminderComplication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: ProjectReminderWatch/Info.plist
      properties:
        CFBundleDisplayName: Reminders
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.danielwang.projectreminder
    entitlements:
      path: ProjectReminderWatch/Watch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danielwang.projectreminder

  # watchOS complication (WidgetKit) — shows the current head project on the watch face
  ProjectReminderComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: ProjectReminderComplication
    dependencies:
      - package: ReminderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielwang.projectreminder.watchkitapp.complication
    info:
      path: ProjectReminderComplication/Info.plist
      properties:
        CFBundleDisplayName: Reminder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ProjectReminderComplication/Complication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.danielwang.projectreminder

schemes:
  ProjectReminderMac:
    build:
      targets: { ProjectReminderMac: all }
    run: { config: Debug }
  ProjectReminder:
    build:
      targets: { ProjectReminder: all }
    run: { config: Debug }
  ProjectReminderWatch:
    build:
      targets: { ProjectReminderWatch: all }
    run: { config: Debug }
